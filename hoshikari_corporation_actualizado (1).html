<style>
:root{
 --primary:#17232d;--primary-2:#243746;--accent:#d35400;--accent-2:#f08a43;
 --light:#f7f8f9;--white:#fff;--dark:#121619;--gray:#66737c;--line:#e4e8eb;
 --shadow:0 16px 45px rgba(17,24,29,.08);--transition:.28s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--light);color:var(--dark);line-height:1.6}
a{color:inherit}
button,input,textarea,select{font:inherit}
.navbar{position:fixed;z-index:1000;top:0;left:0;width:100%;height:78px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:rgba(23,35,45,.97);box-shadow:0 5px 25px rgba(0,0,0,.16)}
.logo{font-size:1.15rem;font-weight:800;letter-spacing:1.7px;color:#fff;text-decoration:none;white-space:nowrap}
.logo span{color:var(--accent-2)}
.nav-links{display:flex;align-items:center;gap:22px;list-style:none}
.nav-links a{color:#edf1f3;text-decoration:none;font-size:.92rem;font-weight:650;padding:28px 0;position:relative;cursor:pointer}
.nav-links a:hover,.nav-links a.active{color:var(--accent-2)}
.nav-links a.active:after{content:"";position:absolute;left:0;right:0;bottom:20px;height:2px;background:var(--accent-2)}
.menu-toggle{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
.page{display:none;padding-top:78px;min-height:calc(100vh - 130px)}
.page.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{min-height:600px;padding:110px 7%;display:flex;align-items:center;background:linear-gradient(90deg,rgba(10,16,20,.92),rgba(10,16,20,.52)),url('https://picsum.photos/1800/900?random=91') center/cover;color:#fff}
.hero-inner{max-width:820px}.eyebrow{color:var(--accent-2);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:.78rem;margin-bottom:15px}
.hero h1{font-size:clamp(2.6rem,6vw,5.3rem);line-height:1.02;margin-bottom:22px}.hero h2{font-size:1.4rem;color:#f2a66f;font-weight:500;margin-bottom:20px}.hero p{font-size:1.12rem;max-width:720px;color:#e7ecef}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-block;border:0;border-radius:999px;padding:13px 24px;font-weight:800;text-decoration:none;cursor:pointer;transition:var(--transition)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 7px 22px rgba(211,84,0,.28)}.btn-primary:hover{transform:translateY(-2px);background:#b94700}
.btn-light{background:#fff;color:var(--primary)}.btn-outline{border:1px solid rgba(255,255,255,.35);color:#fff;background:transparent}
.container{max-width:1200px;margin:auto;padding:72px 5%}.narrow{max-width:850px}
.section-head{margin-bottom:35px}.section-head h1,.section-head h2{color:var(--primary);line-height:1.15;margin-bottom:10px}.section-head h1{font-size:2.6rem}.section-head h2{font-size:2rem}.section-head p{color:var(--gray);max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:var(--transition)}.card:hover{transform:translateY(-5px)}.card img{width:100%;height:190px;object-fit:cover}.card-body{padding:25px}.card h3{color:var(--primary);margin-bottom:8px}.card p{color:#59656d}.tag{display:inline-block;color:var(--accent);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.split img{width:100%;border-radius:18px;box-shadow:var(--shadow)}.split p{margin-bottom:16px;color:#465158;text-align:justify}.checklist{list-style:none;display:grid;gap:12px;margin-top:20px}.checklist li:before{content:"✓";color:var(--accent);font-weight:900;margin-right:10px}
.subnav{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0 35px}.subnav a{background:#fff;border:1px solid var(--line);padding:9px 15px;border-radius:999px;text-decoration:none;color:var(--primary);font-weight:700}.subnav a:hover{border-color:var(--accent);color:var(--accent)}
.news-meta{font-size:.8rem;color:var(--gray);margin-bottom:10px}.news-card{cursor:pointer}
.notice{border-left:5px solid var(--accent);background:#fff;padding:24px 26px;border-radius:0 14px 14px 0;box-shadow:var(--shadow);margin:18px 0}.notice h3{color:var(--primary);margin-bottom:7px}
.job{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:25px;align-items:center}.job+.job{margin-top:16px}.job h3{color:var(--primary)}.job p{color:var(--gray);margin:5px 0}.job .btn{white-space:nowrap}
.faq{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.faq summary{padding:20px 22px;cursor:pointer;font-weight:800;color:var(--primary)}.faq p{padding:0 22px 20px;color:#59656d}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.contact-box{background:var(--primary);color:#fff;border-radius:18px;padding:30px}.contact-box h3{color:#f0a06c;margin-bottom:8px}.contact-box a{color:#fff}
footer{background:var(--primary);color:#dfe6ea;border-top:4px solid var(--accent);padding:35px 5%;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer a{text-decoration:none;color:#fff}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
.back-top{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:1.1rem;cursor:pointer;box-shadow:var(--shadow);display:none}.back-top.show{display:block}
@media(max-width:900px){.nav-links{position:absolute;top:78px;left:0;right:0;background:var(--primary);display:none;flex-direction:column;align-items:stretch;padding:10px 5%;gap:0}.nav-links.open{display:flex}.nav-links a{display:block;padding:13px 0}.nav-links a.active:after{display:none}.menu-toggle{display:block}.split,.contact-grid{grid-template-columns:1fr}.hero{min-height:540px}.job{align-items:flex-start;flex-direction:column}.job .btn{width:100%;text-align:center}}
@media(max-width:560px){.container{padding:55px 5%}.hero{padding:90px 6%}.hero h1{font-size:2.65rem}.section-head h1{font-size:2.15rem}}

.executive-card{background:var(--primary);color:#fff;border-radius:18px;padding:32px;box-shadow:var(--shadow);display:flex;align-items:center;gap:25px}
.executive-avatar{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:1.8rem;font-weight:900;flex:0 0 auto}
.executive-card .tag{color:#f0a06c}.executive-card h3{font-size:1.45rem;margin-bottom:3px}.executive-card p{color:#dfe6ea}
.profile-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.profile-table th,.profile-table td{text-align:left;padding:17px 20px;border-bottom:1px solid var(--line);vertical-align:top}
.profile-table th{width:30%;color:var(--primary);background:#f1f4f5}.profile-table td{color:#4f5b62}
.jp-label{font-size:.72rem;letter-spacing:1.8px;color:var(--accent);font-weight:900;text-transform:uppercase;margin-bottom:8px}
.timeline{display:grid;gap:14px}.phase{background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:var(--shadow);display:grid;grid-template-columns:150px 1fr;gap:20px}.phase strong{color:var(--accent)}
@media(max-width:700px){.phase{grid-template-columns:1fr}}

</head>

      <h2>Un grupo global de medios orientado al entretenimiento.</h2>

<section id="acerca" class="page">
  <div class="container">
    <div class="section-head">
      <div class="jp-label">会社概要 · Company Profile</div>
      <h1>Hoshikari Corporation</h1>
      <p>Perfil corporativo, filosofía, estructura empresarial y dirección ejecutiva.</p>
    </div>

    <nav class="subnav" aria-label="Subnavegación corporativa">
      <a href="#acerca/mensaje">Mensaje corporativo</a>
      <a href="#acerca/filosofia">Filosofía corporativa</a>

    <div id="acerca-mensaje" class="anchor-block">
      <div class="section-head">
        <div class="jp-label">コーポレートメッセージ · Corporate Message</div>
        <h2>Mensaje Corporativo</h2>
      </div>
      <div class="split">
        <div>
          <p>Hoshikari Corporation se consolidará como un grupo global de medios enfocado en la creación, gestión y expansión de propiedad intelectual (IP) dentro del sector del entretenimiento.</p>
          <p>A través de una visión que conecta la tecnología con la narrativa tradicional, actuaremos como la empresa matriz que respaldará y potenciará proyectos culturales originales destinados al público de habla hispana en todo el mundo.</p>
          <p>Nuestra principal filial operativa, <strong>Hoshikari Editorial</strong>, funcionará como una casa productora dedicada exclusivamente a la publicación, distribución y gestión de Manga y Novelas Ligeras (Light Novels) en formato físico y digital.</p>
        </div>
        <img src="https://picsum.photos/800/560?random=121" alt="Hoshikari Corporation - Corporate Message">
      </div>
    </div>

    <div id="acerca-filosofia" class="anchor-block" style="margin-top:75px">
      <div class="section-head">
        <div class="jp-label">企業理念 · Corporate Philosophy</div>
        <h2>Filosofía Corporativa</h2>
        <p>Una filosofía centrada en la propiedad intelectual, la innovación y el desarrollo de talento.</p>
      </div>
      <div class="grid">
        <article class="card"><div class="card-body"><span class="tag">Misión</span><h3>Crear y desarrollar IP</h3><p>Impulsar la creación, gestión y expansión de propiedad intelectual original mediante una integración entre narrativa, edición, tecnología y medios.</p></div></article>
        <article class="card"><div class="card-body"><span class="tag">Visión</span><h3>Proyección global</h3><p>Construir un grupo de medios capaz de llevar proyectos culturales y de entretenimiento de origen hispanohablante hacia una audiencia internacional.</p></div></article>
        <article class="card"><div class="card-body"><span class="tag">Principios</span><h3>IP · Tecnología · Narrativa</h3><p>Combinar creatividad, infraestructura digital y gestión profesional de derechos para construir proyectos con continuidad y potencial de expansión.</p></div></article>
      </div>
    </div>

    <div id="acerca-perfil" class="anchor-block" style="margin-top:75px">
      <div class="section-head">
        <div class="jp-label">会社概要 · Company Profile</div>
        <h2>Perfil de la Empresa</h2>
      </div>
      <table class="profile-table">
        <tr><th>Nombre de la Empresa</th><td><strong>Hoshikari Corporation</strong></td></tr>
        <tr><th>Líneas de Negocio</th><td>
          • Planificación, edición y distribución de Manga y Novelas Ligeras (físico y digital).<br>
          • Desarrollo y operación de plataformas de contenido digital (SAKUBA).<br>
          • Gestión global de derechos y propiedad intelectual (IP).
        </td></tr>
        <tr><th>Oficinas Operativas</th><td><strong>México</strong> — Centro de gestión editorial, desarrollo de talento regional y distribución para el mercado de Latinoamérica.</td></tr>
        <tr><th>Oficinas Centrales</th><td><strong>Japón — Próximo establecimiento</strong> — Sede central global encargada de la dirección estratégica, alianzas internacionales e infraestructura tecnológica del grupo.</td></tr>
      </table>
    </div>

    <div id="acerca-direccion" class="anchor-block" style="margin-top:75px">
      <div class="section-head">
        <div class="jp-label">役員 · Executive Management</div>
        <h2>Dirección Ejecutiva</h2>
        <p>Equipo directivo de Hoshikari Corporation.</p>
      </div>
      <div class="executive-card">
        <div class="executive-avatar">J</div>
        <div>
          <span class="tag">代表取締役 · CEO</span>
          <h3>Johan</h3>
          <p>Chief Executive Officer · Hoshikari Corporation</p>
          <p style="margin-top:8px">Responsable de la dirección ejecutiva y visión estratégica de Hoshikari Corporation.</p>
        </div>
      </div>
      <div class="notice" style="margin-top:20px"><h3>Próximas incorporaciones</h3><p>Los demás cargos ejecutivos podrán incorporarse al perfil corporativo conforme se formalice la estructura de dirección.</p></div>
    </div>

    <div id="acerca-editorial" class="anchor-block" style="margin-top:75px">
      <div class="section-head">
        <div class="jp-label">Hoshikari Editorial</div>
        <h2>Filial Operativa</h2>
        <p>La principal filial operativa de Hoshikari Corporation.</p>
      </div>
      <div class="split">
        <div>
          <h3 style="color:var(--primary);margin-bottom:12px">Publicación · Distribución · Gestión de IP</h3>
          <p>Hoshikari Editorial funcionará como una casa productora dedicada exclusivamente a la publicación, distribución y gestión de Manga y Novelas Ligeras (Light Novels).</p>
          <ul class="checklist">
            <li>Formatos físicos y digitales.</li>
            <li>Desarrollo de catálogo editorial.</li>
            <li>Gestión y expansión de propiedad intelectual.</li>
            <li>Desarrollo de talento de México y Latinoamérica.</li>
          </ul>
        </div>
        <img src="https://picsum.photos/800/560?random=122" alt="Hoshikari Editorial">
      </div>
    </div>

    <div id="acerca-sakuba" class="anchor-block" style="margin-top:75px">
      <div class="section-head">
        <div class="jp-label">作場 · SAKUBA</div>
        <h2>Próximo Proyecto de Negocio: SAKUBA</h2>
        <p>La plataforma oficial de novelas ligeras de Hoshikari.</p>
      </div>
      <div class="notice"><h3>Despliegue de SAKUBA</h3><p>La corporación impulsará la innovación en el ecosistema de lectura digital mediante el lanzamiento de SAKUBA, previsto para la temporada de otoño.</p></div>
      <div class="timeline">
        <div class="phase"><strong>Fase de Lanzamiento</strong><div><h3>Solo Lectura</h3><p>Inicialmente, la plataforma operará de manera exclusiva como un entorno de lectura optimizado. Hoshikari Editorial se encargará directamente de la carga, actualización y gestión institucional de los capítulos y series del catálogo oficial.</p></div></div>
        <div class="phase"><strong>Fase de Apertura</strong><div><h3>Auto-publicación</h3><p>En una etapa posterior, el sistema habilitará funciones de auto-publicación. Los autores independientes podrán subir y gestionar sus propios manuscritos directamente en la interfaz.</p></div></div>
        <div class="phase"><strong>Desarrollo de Historias Originales</strong><div><h3>Nuevos talentos</h3><p>SAKUBA servirá como el canal digital clave para proyectar y profesionalizar las obras de nuevos talentos de México y Latinoamérica.</p></div></div>
      </div>
    </div>
  </div>
</section>

<section id="noticias" class="page">

      <article class="card news-card"><img src="https://picsum.photos/600/380?random=113" alt="SAKUBA"><div class="card-body"><div class="news-meta">Desarrollo · Plataforma</div><h3>SAKUBA 「作場」: plataforma oficial</h3><p>La plataforma oficial de novelas ligeras de Hoshikari se desplegará inicialmente como un entorno de lectura y posteriormente incorporará auto-publicación.</p></div></article>

<section id="convocatoria" class="page">
  <div class="container">
    <div class="section-head"><h1>Convocatoria</h1><p>Espacio destinado a autores y creadores interesados en presentar proyectos a Hoshikari Editorial.</p></div>
    <div class="split">
      <div><h2>Presenta tu obra</h2><p>Buscamos propuestas con una identidad clara, potencial narrativo y una visión que pueda crecer con el acompañamiento editorial.</p><ul class="checklist"><li>Novela ligera y narrativa.</li><li>Manga y proyectos gráficos.</li><li>Proyectos multimedia vinculados a una propiedad intelectual.</li><li>Propuestas originales de autores de habla hispana.</li></ul><div class="actions"><a class="btn btn-primary" href="mailto:convocatorias@hoshikari.com?subject=Convocatoria%20Hoshikari">Enviar propuesta por correo</a></div></div>
      <img src="https://picsum.photos/800/600?random=114" alt="Convocatoria de autores">
    </div>
    <div style="margin-top:55px"><div class="section-head"><h2>¿Qué incluir?</h2></div><div class="grid"><article class="card"><div class="card-body"><h3>1. Datos del autor</h3><p>Nombre, correo de contacto y una breve presentación profesional o creativa.</p></div></article><article class="card"><div class="card-body"><h3>2. Sinopsis</h3><p>Descripción de la obra, género, público objetivo y estado actual del proyecto.</p></div></article><article class="card"><div class="card-body"><h3>3. Material</h3><p>Adjunta el material que quieras someter a evaluación conforme a las condiciones de la convocatoria vigente.</p></div></article></div></div>
  </div>
</section>

<section id="bolsa" class="page">
  <div class="container">
    <div class="section-head"><h1>Bolsa de trabajo</h1><p>Oportunidades para personas que quieran participar en el crecimiento de Hoshikari.</p></div>
    <div class="notice"><h3>¿No encuentras una vacante adecuada?</h3><p>Puedes enviar tu perfil para futuras oportunidades y proyectos. Indica el área en la que te gustaría colaborar.</p></div>
    <div class="job"><div><span class="tag">Editorial</span><h3>Editor/a y corrector/a</h3><p>Revisión, corrección y acompañamiento de proyectos editoriales.</p></div><a class="btn btn-primary" href="mailto:talento@hoshikari.com?subject=Postulacion%20-%20Editor%20Corrector">Postularme</a></div>

<script>
const routes=["inicio","acerca","noticias","convocatoria","bolsa","faq","contacto"];
function normalizeHash(){
  let hash=decodeURIComponent(location.hash.replace(/^#/,""))||"inicio";
  let route=hash.split("/")[0];
  return routes.includes(route)?route:"inicio";
}
function activate(){
  const route=normalizeHash();
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===route));
  document.querySelectorAll(".nav-links a").forEach(a=>a.classList.toggle("active",a.dataset.route===route));
  document.getElementById("mainNav").classList.remove("open");
  window.scrollTo({top:0,behavior:"smooth"});
  if(route==="acerca" && location.hash.includes("/")){
    const sub=location.hash.split("/")[1];
    setTimeout(()=>{
      const el=document.getElementById("acerca-"+sub);
      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
    },120);
  }
}
function toggleMenu(){document.getElementById("mainNav").classList.toggle("open")}
window.addEventListener("hashchange",activate);
window.addEventListener("load",activate);
window.addEventListener("scroll",()=>document.getElementById("backTop").classList.toggle("show",window.scrollY>450));
</script>
